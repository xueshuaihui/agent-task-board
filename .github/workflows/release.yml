# 发布流水线：推 tag 即发布（release 像提交代码一样）
#
# 用法：
#   git tag -a v0.2.0 -m "v0.2.0"
#   git push origin v0.2.0
# → GitHub Actions 云端构建（门禁→sidecar→.app→.dmg→冒烟→SHA256）
# → 自动创建 GitHub Release 并上传 dmg + SHA256SUMS.txt
#
# 通道约定（与 docs/发布手册.md 一致）：
#   - v0.x.* 一律 prerelease（v0.1.0 正式 tag 仍挂在 A3 真机验收门禁之后）
#   - v1.0.0 及以上自动作为正式版
#
# 架构说明：runner 用 macos-13（Intel）。sidecar 的 node 二进制取自构建机当前
# node（bundle-sidecar.mjs 第 4 步），Intel runner 产出 x86_64 node + darwin x64
# Prisma 引擎，与既有 `*_x64.dmg` 产物线一致。未来如需 arm64 产物，改用
# macos-latest（Apple Silicon）并把 DMG/产物命名中的 _x64 相应调整。
#
# 权限：使用仓库自带 GITHUB_TOKEN（无需个人 token），仅需 contents:write。

name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-13
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: 安装依赖 + Prisma 引擎（darwin x64）
        run: |
          npm ci
          npm run prisma

      - name: 打包（门禁 → 构建 → sidecar → .app → .dmg → 冒烟 → SHA256）
        run: bash scripts/package-release.sh

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BUNDLE="apps/desktop/src-tauri/target/release/bundle"
          DMG="${BUNDLE}/dmg/Agent Task Board_$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' apps/desktop/src-tauri/tauri.conf.json | head -1)_x64.dmg"
          [ -f "$DMG" ] || { echo "✗ 未找到 DMG：$DMG"; exit 1; }
          # v0.x.* → prerelease（SOP 通道约定）；v1+ → 正式版
          PRERELEASE=""
          case "$TAG" in v0.*) PRERELEASE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，补充上传产物"
            gh release upload "$TAG" "$DMG" "${BUNDLE}/SHA256SUMS.txt" --clobber
          else
            gh release create "$TAG" "$DMG" "${BUNDLE}/SHA256SUMS.txt" \
              --generate-notes $PRERELEASE \
              --title "$TAG"
          fi
          echo "✅ Release ${TAG} 就绪：$(gh release view "$TAG" --json url -q .url)"
