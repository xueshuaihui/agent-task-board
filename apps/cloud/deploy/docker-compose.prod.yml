name: atb-cloud-prod

# 生产单机编排：cloud（@atb/cloud，SQLite 单文件）+ caddy（自动 HTTPS 边缘）。
# 与开发期（npm run dev:cloud）完全隔离：独立项目名、独立容器名、独立数据卷。
#
# 起服入口（同一份文件，不需要改任何一行）：
#   离线镜像包（唯一路径）：本地 ./deploy/bundle.sh 打产物 → 上传服务器 /opt/agent-task-board-cloud/
#   → 解压进固定目录 → ./deploy.sh（自动导入镜像 → 生成口令 → 体检 → 起服 → 探活）。
#   服务器不需要源码、不需要 Node、不需要联网拉镜像。
#
# 镜像 tag 固定 latest（服务端没有版本号）：发版就是「覆盖 latest 指向 + 起服」，
# 回退靠 deploy.sh 在发版前自动留下的 :prev。要查「线上跑的是哪次提交」看
# docker image inspect 的 org.opencontainers.image.revision 标签或 GET /healthz 的 commit 字段。
#
# SQLite 无独立数据库容器、无一次性 migrate 容器：迁移由 cloud 启动时自执行
# （src/infra/bootstrap.ts，水位在库内 _cloud_migrations 表），可反复启动、幂等。
# 数据落在命名卷 cloud_data（/data/cloud.db，WAL 模式），备份/恢复见 deploy.sh backup / restore。
#
# 边缘层说明：
#   - caddy 服务挂在 compose profile "edge" 下，独占宿主机 80/443，向 Let's Encrypt 自动申请
#     并续签证书，反代到 cloud:7789。只需在 .env.prod 填 SITE_DOMAIN 与 ACME_EMAIL。
#   - 宿主机 80/443 已被别的边缘占用时，在 .env.prod 设 EDGE_MODE=off：caddy 不进编排，
#     由既有边缘把站点反代到 HTTP_BIND:HTTP_PORT（默认 127.0.0.1:7789），证书由该边缘签发。
#   - 证书数据落命名卷 caddy_data，重启用同一份卷即可免重复申请。

services:
  cloud:
    image: agent-task-board-cloud:latest
    container_name: atb-cloud-prod-cloud
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CLOUD_PORT: 7789
      CLOUD_DATA_DIR: /data
      CLOUD_JWT_SECRET: ${CLOUD_JWT_SECRET:?CLOUD_JWT_SECRET 未设置}
      # 同域反代（caddy/外部边缘）无需 CORS，留空即可；桌面端直连域名时把 WebView 来源逗号分隔列出
      CLOUD_CORS_ORIGINS: ${CLOUD_CORS_ORIGINS:-}
      CLOUD_SQL_LOG: ${CLOUD_SQL_LOG:-}
    volumes:
      - cloud_data:/data
    # 只绑回环：公网流量全部经 caddy（宿主机 80/443）反代进来；本地回环仍可作为调试入口。
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-7789}:7789"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7789/healthz || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 15s
    networks: [atb]

  # 自动 HTTPS 边缘层：独占宿主机 80/443，向 Let's Encrypt 自动签发并续签证书，
  # 把全站反代到 cloud:7789。EDGE_MODE=off 时（COMPOSE_PROFILES 置空）不参与编排。
  caddy:
    image: caddy:2-alpine
    container_name: atb-cloud-prod-caddy
    profiles: [edge]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # 留空走生产 CA；填 staging 地址用于测试，避免触发 Let's Encrypt 速率限制
      ACME_CA_BLOCK: ${ACME_CA_BLOCK:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      cloud:
        condition: service_healthy
    networks: [atb]

volumes:
  cloud_data:
  caddy_data:
  caddy_config:

networks:
  atb:
    driver: bridge
